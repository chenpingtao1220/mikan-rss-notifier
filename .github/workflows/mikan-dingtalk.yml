name: Mikan RSS DingTalk Notify

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore last run state
        uses: actions/cache/restore@v4
        with:
          path: last_run.txt
          key: last-run-${{ github.run_id }}
          restore-keys: |
            last-run-

      - name: Fetch RSS and Push to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          MIKAN_RSS_URLS: ${{ secrets.MIKAN_RSS_URLS }}
        run: |
          set -e
          
          if [ -f "last_run.txt" ]; then
            PREVIOUS_TITLES=$(cat last_run.txt)
          else
            PREVIOUS_TITLES=""
          fi
          
          NEW_TITLES=""
          IFS=',' read -ra URLS <<< "$MIKAN_RSS_URLS"
          for URL in "${URLS[@]}"; do
            URL=$(echo "$URL" | xargs)
            if [ -z "$URL" ]; then continue; fi
            TITLES=$(curl -s -L "$URL" | grep -oP '(?<=<title>).*?(?=</title>)' | tail -n +2)
            while IFS= read -r TITLE; do
              if [ -n "$TITLE" ]; then
                # 🌟 核心升级：清空特殊字符，只留纯文本进行比对，防止被符号坑
                CLEAN_TITLE=$(echo "$TITLE" | tr -d '[:punct:] [:space:]')
                CLEAN_PREVIOUS=$(echo "$PREVIOUS_TITLES" | tr -d '[:punct:] [:space:]')
                
                if [[ "$TITLE" == *"简"* ]] && [[ "$CLEAN_PREVIOUS" != *"$CLEAN_TITLE"* ]]; then
                  NEW_TITLES+="$TITLE"$'\n'
                fi
              fi
            done <<< "$TITLES"
          done
          
          if [ -z "$NEW_TITLES" ]; then
            echo "没有发现真正的新简体资源，跳过推送。"
            exit 0
          fi

          RECENT_TITLES=$(echo "$NEW_TITLES" | head -n 5)
          
          JSON_DATA=$(cat <<EOF
          {
            "msgtype": "text",
            "text": {
              "content": "【蜜柑更新: 新简体资源】\n\n$RECENT_TITLES\n\n请前往蜜柑计划查看。"
            }
          }
          EOF
          )
          
          curl -s -X POST "$DINGTALK_WEBHOOK" -H "Content-Type: application/json" -d "$JSON_DATA"
          echo "推送已发送。"
          
          echo "$PREVIOUS_TITLES" > last_run.txt
          echo "$NEW_TITLES" >> last_run.txt
          head -n 50 last_run.txt > last_run_temp.txt && mv last_run_temp.txt last_run.txt

      - name: Save last run state
        uses: actions/cache/save@v4
        with:
          path: last_run.txt
          key: last-run-${{ github.run_id }}
